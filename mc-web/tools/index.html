<!doctype html>
<meta charset="utf-8">
<title>mc-web</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:14px monospace}canvas{display:block}</style>
<canvas id="game" width="854" height="480"></canvas>
<script>Error.stackTraceLimit = 100; globalThis.mcwebStats = new URLSearchParams(location.search).has("stats");</script>
<script src="mcweb.js"></script>
<script src="mcshader.js"></script>
<script src="mcaudio.js"></script>
<script src="game.wasm-runtime.js"></script>
<script>
(async () => {
  try {
    const res = await fetch("client-resources.zip");
    if (res.ok) {
      globalThis.mcwebArchive = new Int8Array(await res.arrayBuffer());
    }
    globalThis.mcshader = await mcshaderLoad(await fetch("mcshader.wasm"));
    const t = await TeaVM.wasmGC.load("game-split.wasm");
    await t.exports.main([]);
  } catch (e) {
    console.log("ERR " + e + "\n" + (e.stack || "").split("\n").slice(0, 60).join("\n"));
  }
})();
</script>
