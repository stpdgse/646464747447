plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}
repositories { mavenCentral() }
dependencies {
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation files('../classlib-ext/build/libs/classlib-ext.jar')
}
teavm.wasmGC {
    mainClass = 'probe.GuavaProbe'
    outOfProcess = false
    copyRuntime = true
}
