plugins { id 'java' }
repositories { mavenCentral(); maven { url 'https://libraries.minecraft.net' } }
configurations { teavmTool; gameLibs }
dependencies {
    teavmTool 'org.teavm:teavm-tooling:0.16.0'
    teavmTool 'org.teavm:teavm-classlib:0.16.0'
    teavmTool 'org.teavm:teavm-jso:0.16.0'
    teavmTool 'org.teavm:teavm-jso-apis:0.16.0'
    teavmTool 'org.teavm:teavm-jso-impl:0.16.0'
    teavmTool 'org.teavm:teavm-interop:0.16.0'
    teavmTool 'org.teavm:teavm-metaprogramming-impl:0.16.0'
    teavmTool 'org.teavm:teavm-metaprogramming-api:0.16.0'
    gameLibs 'at.yawk.lz4:lz4-java:1.10.1'
    gameLibs 'ca.weblite:java-objc-bridge:1.1'
    gameLibs 'com.azure:azure-json:1.4.0'
    gameLibs 'com.github.oshi:oshi-core:6.9.0'
    gameLibs 'com.google.code.gson:gson:2.14.0'
    gameLibs 'com.google.guava:failureaccess:1.0.3'
    gameLibs 'com.google.guava:guava:33.6.0-jre'
    gameLibs 'com.ibm.icu:icu4j:78.3'
    gameLibs 'com.microsoft.azure:msal4j:1.24.1'
    gameLibs 'com.mojang:authlib:10.0.77'
    gameLibs 'com.mojang:blocklist:1.0.10'
    gameLibs 'com.mojang:brigadier:1.3.11'
    gameLibs 'com.mojang:datafixerupper:10.0.21'
    gameLibs 'com.mojang:jtracy:1.14.38'
    gameLibs 'com.mojang:logging:1.7.12'
    gameLibs 'com.mojang:patchy:2.2.10'
    gameLibs 'com.mojang:text2speech:1.19.12'
    gameLibs 'commons-codec:commons-codec:1.22.0'
    gameLibs 'commons-io:commons-io:2.20.0'
    gameLibs 'io.netty:netty-buffer:4.2.16.Final'
    gameLibs 'io.netty:netty-codec-base:4.2.16.Final'
    gameLibs 'io.netty:netty-codec-compression:4.2.16.Final'
    gameLibs 'io.netty:netty-codec-http:4.2.16.Final'
    gameLibs 'io.netty:netty-common:4.2.16.Final'
    gameLibs 'io.netty:netty-handler:4.2.16.Final'
    gameLibs 'io.netty:netty-resolver:4.2.16.Final'
    gameLibs 'io.netty:netty-transport-classes-epoll:4.2.16.Final'
    gameLibs 'io.netty:netty-transport-classes-kqueue:4.2.16.Final'
    gameLibs 'io.netty:netty-transport-native-unix-common:4.2.16.Final'
    gameLibs 'io.netty:netty-transport:4.2.16.Final'
    gameLibs 'it.unimi.dsi:fastutil:8.5.18'
    gameLibs 'net.java.dev.jna:jna-platform:5.17.0'
    gameLibs 'net.java.dev.jna:jna:5.17.0'
    gameLibs 'net.sf.jopt-simple:jopt-simple:5.0.4'
    gameLibs 'org.apache.commons:commons-compress:1.28.0'
    gameLibs 'org.apache.commons:commons-lang3:3.20.0'
    gameLibs 'org.apache.logging.log4j:log4j-api:2.26.0'
    gameLibs 'org.apache.logging.log4j:log4j-core:2.26.0'
    gameLibs 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'
    gameLibs 'org.jcraft:jorbis:0.0.17'
    gameLibs 'org.joml:joml:1.10.9'
    gameLibs 'org.jspecify:jspecify:1.0.0'
    gameLibs 'org.lwjgl:lwjgl-freetype:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-jemalloc:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-openal:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-opengl:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-sdl:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-shaderc:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-spvc:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-stb:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-vma:3.4.3'
    gameLibs 'org.lwjgl:lwjgl-vulkan:3.4.3'
    gameLibs 'org.lwjgl:lwjgl:3.4.3'
    gameLibs 'org.slf4j:slf4j-api:2.0.17'
}
configurations.gameLibs {
    exclude group: 'com.mojang', module: 'jtracy'
    exclude group: 'com.mojang', module: 'text2speech'
    exclude group: 'ca.weblite'
    exclude group: 'io.netty', module: 'netty-transport-classes-epoll'
    exclude group: 'io.netty', module: 'netty-transport-classes-kqueue'
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
    exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
    exclude group: 'io.netty', module: 'netty-transport-native-unix-common'
    exclude group: 'net.java.dev.jna'
    exclude group: 'com.github.oshi'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
}
tasks.register('copyLibs', Copy) {
    from configurations.teavmTool into 'libs/tool'
}
tasks.register('copyGameLibs', Copy) {
    from configurations.gameLibs into 'libs/game'
}
