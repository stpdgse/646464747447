buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = project.mod_version
group = 'com.openfpv'
archivesBaseName = project.mod_id + '-' + project.mc_version

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('autotest')) property 'openfpv.autotest', project.property('autotest')
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
        }
    }
}

// ForgeGradle 3 dev runs load a mod's assets from its *classes* directory; without this the
// resources land in build/resources/main and the dev client cannot find models, lang or textures.
sourceSets.main.output.resourcesDir = sourceSets.main.java.outputDir

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}"

    // OC's public API (interfaces only) - this is all the mod needs at compile time.
    compileOnly files("libs/OpenComputers-${project.oc_api_version}-api.jar")

    testCompile 'junit:junit:4.12'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.mc_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.mc_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    exclude 'com/openfpv/dev/**'   // developer self-test harness, not shipped
    manifest {
        attributes([
            "Specification-Title"     : project.mod_name,
            "Specification-Vendor"    : "OpenFPV",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "OpenFPV",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
