[package]
name = "ferrite-server"
description = "The Ferrite Minecraft server executable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["uring"]
uring = ["ferrite-net/uring"]

[dependencies]
clap.workspace = true
ferrite-data.workspace = true
ferrite-net = { path = "../ferrite-net", default-features = false }
ferrite-protocol = { path = "../ferrite-protocol" }
mimalloc = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
