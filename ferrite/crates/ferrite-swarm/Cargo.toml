[package]
name = "ferrite-swarm"
description = "Bot swarm load tester: protocol-correct clients that join servers, with latency reporting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
ferrite-data.workspace = true
getrandom = { version = "0.4", features = ["sys_rng"] }
ferrite-nbt = { path = "../ferrite-nbt" }
ferrite-protocol = { path = "../ferrite-protocol" }
socket2 = { version = "0.5", features = ["all"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "io-std"] }
uuid.workspace = true

[lints]
workspace = true
