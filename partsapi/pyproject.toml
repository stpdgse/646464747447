[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partsapi"
version = "0.1.0"
description = "Unified part lookup API for JLCPCB parts, LCSC parts and Reichelt: search, price, stock, pictures, datasheets and 3D models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["flask>=3"]

[project.scripts]
partsapi = "partsapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real websites (set PARTSAPI_LIVE=1 to run)"]

[tool.setuptools.package-data]
partsapi = ["web/static/*"]
